<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StoneMark Inspections | Home Inspector in Paducah, KY & Western Kentucky</title>
  <meta name="description" content="StoneMark Inspections provides licensed, insured home inspections across Paducah and Western Kentucky. Clear, photo-documented reports delivered fast." />

  <style>
    :root{
      --bg:#000;
      --sandstone:#c2a875;
      --sandstone-soft:rgba(194,168,117,.18);
      --sandstone-border:rgba(194,168,117,.26);
      --text:#fff;
      --muted:rgba(255,255,255,.70);
      --muted2:rgba(255,255,255,.55);

      --nav-h:78px;
      --max:1320px;

      --tile-bg:rgba(0,0,0,.52);
      --tile-bg2:rgba(0,0,0,.62);
      --tile-border:rgba(194,168,117,.22);
      --tile-shadow: 0 14px 40px rgba(0,0,0,.55);
      --tile-radius:20px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x:hidden;
    }

    /* Background like the render: image + soft vignette */
    .page-bg{
      position:fixed; inset:0;
      background:
        radial-gradient(1100px 600px at 34% 52%, rgba(194,168,117,.12), transparent 60%),
        radial-gradient(900px 500px at 70% 40%, rgba(194,168,117,.08), transparent 62%),
        linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.82)),
        url("assets/hero-bg.jpg");
      background-size: cover;
      background-position: center;
      filter:saturate(.95) contrast(1.02);
      transform:scale(1.02);
      z-index:-3;
    }
    .vignette{
      position:fixed; inset:0;
      background:
        radial-gradient(1200px 700px at 40% 55%, transparent 35%, rgba(0,0,0,.55) 70%, rgba(0,0,0,.78) 100%);
      z-index:-2;
      pointer-events:none;
    }
    .grain{
      position:fixed; inset:0;
      background-image:url("assets/grain.png");
      opacity:.06;
      mix-blend-mode:overlay;
      z-index:-1;
      pointer-events:none;
    }

    /* Top Nav */
    header{
      height:var(--nav-h);
      display:flex;
      align-items:center;
      justify-content:center;
      position:sticky;
      top:0;
      z-index:50;
      background: linear-gradient(to bottom, rgba(0,0,0,.72), rgba(0,0,0,.20));
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .nav-wrap{
      width:min(var(--max), calc(100% - 48px));
      display:flex;
      align-items:center;
      gap:18px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 270px;
      text-decoration:none;
      color:inherit;
    }
    .brand-mark{
      width:46px;height:46px;border-radius:50%;
      border:1px solid rgba(194,168,117,.22);
      background: radial-gradient(circle at 30% 30%, rgba(194,168,117,.25), rgba(0,0,0,.15));
      display:grid;place-items:center;
      box-shadow: 0 10px 25px rgba(0,0,0,.45);
      overflow:hidden;
    }
    .brand-mark img{width:100%;height:100%;object-fit:cover;display:block}
    .brand-text{
      line-height:1.05;
      letter-spacing:.6px;
    }
    .brand-text .top{
      font-weight:700;
      font-size:15px;
    }
    .brand-text .sub{
      font-size:10.5px;
      color: var(--muted2);
      letter-spacing: 1.8px;
      margin-top:4px;
    }

    nav{
      flex:1;
      display:flex;
      justify-content:center;
      gap:28px;
    }
    nav a{
      text-decoration:none;
      color: rgba(255,255,255,.62);
      font-size:12px;
      letter-spacing:2.6px;
      text-transform:uppercase;
      padding:10px 6px;
      transition: color .2s ease;
    }
    nav a:hover{color:#fff}

    .nav-ctas{
      display:flex;
      align-items:center;
      gap:12px;
      margin-left:auto;
    }
    .pill{
      height:38px;
      padding:0 18px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      font-size:12px;
      letter-spacing:1.7px;
      text-transform:uppercase;
      border:1px solid rgba(194,168,117,.24);
      box-shadow: 0 12px 30px rgba(0,0,0,.45);
      white-space:nowrap;
    }
    .pill.dark{
      color: rgba(255,255,255,.82);
      background: rgba(0,0,0,.38);
    }
    .pill.gold{
      color:#1b1408;
      background: linear-gradient(135deg, rgba(194,168,117,.95), rgba(214,189,137,.92));
      border-color: rgba(194,168,117,.40);
    }

    /* Hero */
    main{
      display:flex;
      justify-content:center;
    }
    .hero{
      width:min(var(--max), calc(100% - 48px));
      min-height: calc(100vh - var(--nav-h));
      display:grid;
      grid-template-columns: 1.1fr 1fr;
      align-items:center;
      gap: 46px;
      padding: 34px 0 60px;
    }

    /* Portrait: NO BOX. Soft fade like the render */
    .portrait{
      position:relative;
      height: 560px;
      display:flex;
      align-items:flex-end;
      justify-content:flex-start;
      overflow:visible; /* important: no clipping */
    }
    .portrait img{
      height: 560px;
      width:auto;
      display:block;
      filter:
        drop-shadow(0 26px 55px rgba(0,0,0,.68))
        saturate(1.02)
        contrast(1.02);
      /* soft edge fade so it blends into background */
      -webkit-mask-image: radial-gradient(circle at 45% 40%, #000 62%, transparent 82%);
              mask-image: radial-gradient(circle at 45% 40%, #000 62%, transparent 82%);
    }
    .portrait::after{
      content:"";
      position:absolute;
      inset:-40px -60px -40px -60px;
      background: radial-gradient(600px 420px at 45% 55%, rgba(0,0,0,.0), rgba(0,0,0,.55) 70%, rgba(0,0,0,.0) 88%);
      pointer-events:none;
    }

    /* Tiles */
    .actions{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:center;
      gap: 18px;
    }
    .tiles{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 18px;
      width: 100%;
      max-width: 610px;
    }
    .tile{
      position:relative;
      display:flex;
      gap:16px;
      align-items:center;
      padding: 20px 22px;
      border-radius: var(--tile-radius);
      background: linear-gradient(to bottom, var(--tile-bg), var(--tile-bg2));
      border: 1px solid var(--tile-border);
      box-shadow: var(--tile-shadow);
      text-decoration:none;
      color:inherit;
      transition: transform .15s ease, border-color .15s ease;
    }
    .tile:hover{
      transform: translateY(-2px);
      border-color: rgba(194,168,117,.38);
    }
    .tile::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius: var(--tile-radius);
      background: radial-gradient(220px 120px at 18% 30%, rgba(194,168,117,.14), transparent 60%);
      pointer-events:none;
    }
    .icon{
      width:56px;
      height:56px;
      flex:0 0 56px;
      display:grid;
      place-items:center;
      filter: drop-shadow(0 10px 18px rgba(194,168,117,.15));
    }
    .icon svg{
      width:56px;
      height:56px;
      fill: var(--sandstone);
      opacity:.95;
    }
    .ttext{
      line-height:1.05;
    }
    .ttext .top{
      font-size:18px;
      font-weight:700;
      letter-spacing:.3px;
      margin-bottom:6px;
    }
    .ttext .sub{
      font-size:14px;
      color: rgba(194,168,117,.92);
      letter-spacing:.2px;
    }

    .micro{
      margin-top: 10px;
      font-size:10.5px;
      letter-spacing:2.3px;
      text-transform:uppercase;
      color: rgba(255,255,255,.38);
      align-self:center;
      width:100%;
      text-align:center;
      max-width: 610px;
    }

    /* Responsive */
    @media (max-width: 980px){
      nav{display:none}
      .brand{min-width:auto}
      .hero{
        grid-template-columns: 1fr;
        gap: 26px;
        padding-top: 22px;
      }
      .portrait{
        height: 420px;
        justify-content:center;
      }
      .portrait img{height:420px}
      .actions{align-items:center}
      .tiles{max-width: 680px}
    }
    @media (max-width: 560px){
      .tiles{grid-template-columns:1fr}
      .portrait{height: 360px}
      .portrait img{height:360px}
      .nav-wrap{width:calc(100% - 24px)}
      .pill{padding:0 14px}
    }
  </style>
</head>
