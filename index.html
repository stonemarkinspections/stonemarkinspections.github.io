<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoneMark Inspections | Home Inspector in Paducah, KY & Western Kentucky</title>
  <meta name="description" content="StoneMark Inspections provides licensed, insured home inspections across Paducah and Western Kentucky. Clear, photo-documented reports delivered fast." />

  <!-- Open Graph (optional but good for sharing) -->
  <meta property="og:title" content="StoneMark Inspections" />
  <meta property="og:description" content="Home Inspector in Paducah, KY & Western Kentucky" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#000;
      --gold:#c2a875;
      --gold2:#d8bf85;
      --text:#ffffff;
      --muted:rgba(255,255,255,0.72);

      --glass:rgba(0,0,0,0.52);
      --glass2:rgba(0,0,0,0.35);
      --stroke:rgba(194,168,117,0.20);
      --stroke2:rgba(194,168,117,0.32);

      --shadow: 0 18px 55px rgba(0,0,0,0.68);
      --shadow2: 0 10px 35px rgba(0,0,0,0.55);
      --radius: 18px;
      --radius2: 22px;

      --max: 1400px;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; background:var(--bg); color:var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif; }
    a{ color:inherit; text-decoration:none; }
    img{ display:block; max-width:100%; }

    /* ====== PAGE BACKGROUND ====== */
    body{
      overflow-x:hidden;
    }
    .bg{
      position:fixed; inset:0; z-index:-3;
      background:
        radial-gradient(1200px 700px at 70% 35%, rgba(194,168,117,0.10), transparent 55%),
        radial-gradient(900px 600px at 20% 70%, rgba(194,168,117,0.08), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,0.88), rgba(0,0,0,0.95));
    }
    .bg::before{
      content:"";
      position:absolute; inset:0;
      /* Optional: add a stone texture image to get it closer to your screenshot.
         Put file at: assets/bg-stone.webp (or .jpg/.png) and uncomment the next line. */
      /* background: url("assets/bg-stone.webp") center/cover no-repeat; */
      opacity:0.45;
      filter: contrast(1.05) saturate(0.9);
      mix-blend-mode: overlay;
    }
    .bg::after{
      content:"";
      position:absolute; inset:-30%;
      background: radial-gradient(closest-side, rgba(255,255,255,0.06), transparent 55%);
      opacity:0.25;
      transform: translate3d(0,0,0);
      pointer-events:none;
    }

    /* ====== HEADER ====== */
    header{
      position:sticky; top:0; z-index:50;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: linear-gradient(180deg, rgba(0,0,0,0.82), rgba(0,0,0,0.50));
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .navwrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap: 12px;
      min-width: 230px;
    }
    .brand img{
      height: 34px;
      width:auto;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.45));
    }
    /* If you don't have a logo file yet, this text fallback will look good */
    .brand .brandText{
      display:flex;
      flex-direction:column;
      line-height:1.05;
    }
    .brand .brandText .top{
      letter-spacing:0.20em;
      font-size: 12px;
      color: rgba(255,255,255,0.85);
    }
    .brand .brandText .bottom{
      font-weight: 650;
      letter-spacing:0.08em;
      font-size: 13px;
      color: rgba(255,255,255,0.72);
      margin-top:3px;
    }

    nav{
      display:flex;
      align-items:center;
      gap: 26px;
      flex-wrap:wrap;
      justify-content:center;
      flex: 1;
    }
    nav a{
      font-size: 12px;
      letter-spacing: 0.26em;
      color: rgba(255,255,255,0.72);
      transition: color .18s ease;
      text-transform: uppercase;
      padding: 10px 0;
    }
    nav a:hover{ color: rgba(255,255,255,0.95); }

    .navCTAs{
      display:flex;
      align-items:center;
      gap: 12px;
      min-width: 280px;
      justify-content:flex-end;
    }
    .pill{
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: 1px solid rgba(194,168,117,0.30);
      background: rgba(0,0,0,0.35);
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
      white-space: nowrap;
    }
    .pill:hover{
      transform: translateY(-1px);
      border-color: rgba(194,168,117,0.45);
      background: rgba(0,0,0,0.45);
    }
    .pill.gold{
      border-color: rgba(194,168,117,0.55);
      background: linear-gradient(180deg, rgba(194,168,117,0.40), rgba(194,168,117,0.18));
      color: rgba(0,0,0,0.92);
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .pill.gold:hover{
      border-color: rgba(216,191,133,0.72);
      background: linear-gradient(180deg, rgba(216,191,133,0.48), rgba(194,168,117,0.22));
      transform: translateY(-1px);
    }

    /* ====== HERO LAYOUT ====== */
    main{
      max-width: var(--max);
      margin: 0 auto;
      padding: 26px 18px 42px;
    }
    .hero{
      position:relative;
      min-height: calc(100vh - 86px);
      display:grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 26px;
      align-items:center;
      padding-top: 10px;
    }

    /* Left portrait */
    .portraitWrap{
      position:relative;
      min-height: 560px;
      border-radius: 26px;
      overflow:hidden;
      box-shadow: var(--shadow);
    }
    .portraitWrap::before{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(120% 120% at 55% 35%, transparent 35%, rgba(0,0,0,0.78) 75%);
      z-index:2;
      pointer-events:none;
    }
    .portraitWrap::after{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(90deg, rgba(0,0,0,0.55), transparent 60%);
      z-index:2;
      pointer-events:none;
    }
    .portrait{
      position:absolute; inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      object-position: 35% 30%;
      filter: contrast(1.02) saturate(0.92);
      transform: scale(1.02);
    }

    /* Right button panel (floating, no card container like screenshot) */
    .panel{
      display:flex;
      flex-direction:column;
      gap: 18px;
      align-items:flex-end;
      justify-content:center;
      padding-right: 6px;
    }

    .grid{
      width: min(680px, 100%);
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .tile{
      position:relative;
      display:flex;
      align-items:center;
      gap: 16px;
      padding: 18px 18px;
      border-radius: var(--radius2);
      background: linear-gradient(180deg, var(--glass), var(--glass2));
      border: 1px solid rgba(194,168,117,0.22);
      box-shadow: var(--shadow2);
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
      overflow:hidden;
    }
    .tile::before{
      content:"";
      position:absolute; inset:-1px;
      border-radius: inherit;
      background:
        radial-gradient(600px 180px at 20% 0%, rgba(194,168,117,0.12), transparent 60%),
        radial-gradient(600px 180px at 80% 100%, rgba(194,168,117,0.10), transparent 60%);
      opacity: 0.9;
      pointer-events:none;
    }
    .tile:hover{
      transform: translateY(-2px);
      border-color: rgba(194,168,117,0.40);
      background: linear-gradient(180deg, rgba(0,0,0,0.62), rgba(0,0,0,0.40));
    }

    .tileIcon{
      width: 78px;
      height: 78px;
      flex: 0 0 78px;
      border-radius: 16px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(194,168,117,0.10);
    }
    .tileIcon img{
      width: 78px;
      height: 78px;
      object-fit: cover; /* icons are full tiles */
      filter: drop-shadow(0 0 10px rgba(194,168,117,0.18));
    }

    .tileText{
      display:flex;
      flex-direction:column;
      line-height:1.0;
      gap: 6px;
      position:relative;
      z-index:1;
    }
    .tileTitle{
      font-size: 22px;
      font-weight: 650;
      color: rgba(255,255,255,0.92);
      letter-spacing: 0.02em;
    }
    .tileSub{
      font-size: 18px;
      font-weight: 520;
      color: rgba(194,168,117,0.95);
      letter-spacing: 0.02em;
    }
    .tileSmall{
      font-size: 16px;
      color: rgba(255,255,255,0.80);
      letter-spacing: 0.02em;
    }

    /* Two special top tiles in screenshot style */
    .tile.request .tileSub{ color: rgba(194,168,117,0.95); }
    .tile.call .tileTitle{ font-size: 20px; }
    .tile.call .tileSub{ font-size: 16px; color: rgba(255,255,255,0.80); }

    /* Footer microtext under grid (optional) */
    .micro{
      width:min(680px, 100%);
      margin-top: 8px;
      color: rgba(255,255,255,0.55);
      font-size: 12px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      text-align:right;
    }

    /* ====== RESPONSIVE ====== */
    @media (max-width: 980px){
      nav{ display:none; } /* keep header clean on smaller screens */
      .navwrap{ padding: 12px 14px; }
      .hero{
        grid-template-columns: 1fr;
        min-height: auto;
        padding-top: 14px;
      }
      .portraitWrap{
        min-height: 420px;
      }
      .panel{
        align-items:stretch;
        padding-right:0;
      }
      .grid{
        width:100%;
      }
      .micro{ text-align:left; }
    }

    @media (max-width: 560px){
      .grid{ grid-template-columns: 1fr; }
      .tileTitle{ font-size: 20px; }
      .tileSub{ font-size: 16px; }
      .tileIcon{ width: 70px; height: 70px; flex-basis:70px; }
      .tileIcon img{ width: 70px; height: 70px; }
      .navCTAs .pill{ padding: 9px 12px; font-size: 11px; }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <header>
    <div class="navwrap">
      <a class="brand" href="index.html" aria-label="StoneMark Inspections Home">
        <!-- If you have a real logo file, put it at assets/stonemark-logo.png and uncomment this image -->
        <!-- <img src="assets/stonemark-logo.png" alt="StoneMark Inspections Logo"> -->

        <!-- Text fallback (looks good until you upload the real logo) -->
        <div class="brandText">
          <div class="top">STONEMARK</div>
          <div class="bottom">HOME INSPECTIONS</div>
        </div>
      </a>

      <nav aria-label="Primary">
        <a href="services.html">Services</a>
        <a href="service-area.html">Service Area</a>
        <a href="credentials.html">Credentials</a>
        <a href="reports.html">Reports</a>
        <a href="contact.html">Contact</a>
      </nav>

      <div class="navCTAs">
        <a class="pill" href="tel:2703498237">Call/Text</a>
        <a class="pill gold" href="request.html">Request Inspection</a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <!-- LEFT: Portrait -->
      <div class="portraitWrap">
        <!-- Your uploaded image of you -->
        <img class="portrait" src="logo1.png" alt="StoneMark Inspector Portrait" />
      </div>

      <!-- RIGHT: Tiles -->
      <div class="panel">
        <div class="grid">

          <!-- Request Inspection -->
          <a class="tile request" href="request.html">
            <div class="tileIcon">
              <img src="assets/icons/icon-request.webp" alt="Request Inspection Icon">
            </div>
            <div class="tileText">
              <div class="tileTitle">Request</div>
              <div class="tileSub">Inspection</div>
            </div>
          </a>

          <!-- Call/Text -->
          <a class="tile call" href="tel:2703498237">
            <div class="tileIcon">
              <img src="assets/icons/icon-phone.webp" alt="Call Text Icon">
            </div>
            <div class="tileText">
              <div class="tileTitle">Call/Text</div>
              <div class="tileSub">(270) 349-8237</div>
            </div>
          </a>

          <!-- Home Inspection -->
          <a class="tile" href="services.html#home-inspection">
            <div class="tileIcon">
              <img src="assets/icons/icon-home.webp" alt="Home Inspection Icon">
            </div>
            <div class="tileText">
              <div class="tileTitle">Home</div>
              <div class="tileSub">Inspection</div>
            </div>
          </a>

          <!-- Radon Testing -->
          <a class="tile" href="services.html#radon">
            <div class="tileIcon">
              <img src="assets/icons/icon-radon.webp" alt="Radon Testing Icon">
            </div>
            <div class="tileText">
              <div class="tileTitle">Radon</div>
              <div class="tileSub">Testing</div>
            </div>
          </a>

          <!-- Mold Inspection -->
          <a class="tile" href="services.html#mold">
            <div class="tileIcon">
              <img src="assets/icons/icon-mold.webp" alt="Mold Inspection Icon">
            </div>
            <div class="tileText">
              <div class="tileTitle">Mold</div>
              <div class="tileSub">Inspection</div>
            </div>
          </a>

          <!-- Indoor Air Quality -->
          <a class="tile" href="services.html#iaq">
            <div class="tileIcon">
              <img src="assets/icons/icon-airquality.webp" alt="Indoor Air Quality Icon">
            </div>
            <div class="tileText">
              <div class="tileTitle">Indoor</div>
              <div class="tileSub">Air Quality</div>
            </div>
          </a>

          <!-- Pool & Spa -->
          <a class="tile" href="services.html#pool-spa">
            <div class="tileIcon">
              <img src="assets/icons/icon-pool.webp" alt="Pool and Spa Icon">
            </div>
            <div class="tileText">
              <div class="tileTitle">Pool &amp; Spa</div>
              <div class="tileSub">Inspection</div>
            </div>
          </a>

          <!-- Thermal Imaging -->
          <a class="tile" href="services.html#thermal">
            <div class="tileIcon">
              <img src="assets/icons/icon-thermal.webp" alt="Thermal Imaging Icon">
            </div>
            <div class="tileText">
              <div class="tileTitle">Thermal</div>
              <div class="tileSub">Imaging</div>
            </div>
          </a>

        </div>

        <div class="micro">
          Licensed • Insured • Photo-Documented Reports
        </div>
      </div>
    </section>
  </main>

  <!-- OPTIONAL: If you want smooth anchor scrolling -->
  <script>
    document.querySelectorAll('a[href^="#"]').forEach(a=>{
      a.addEventListener('click', (e)=>{
        const id = a.getAttribute('href');
        const el = document.querySelector(id);
        if(!el) return;
        e.preventDefault();
        el.scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
  </script>
</body>
</html>
