<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoneMark Inspections | Home Inspector in Paducah, KY & Western Kentucky</title>
  <meta name="description" content="StoneMark Inspections provides licensed, insured home inspections across Paducah and Western Kentucky. Clear, photo-documented reports delivered fast." />

  <style>
    :root{
      --bg:#000;
      --gold:#c2a875;
      --gold2:#d8bf85;
      --text:#ffffff;
      --muted:rgba(255,255,255,0.72);

      --glass:rgba(0,0,0,0.56);
      --glass2:rgba(0,0,0,0.36);

      --stroke:rgba(194,168,117,0.22);
      --strokeHover:rgba(194,168,117,0.40);

      --shadow: 0 18px 55px rgba(0,0,0,0.68);
      --shadow2: 0 10px 35px rgba(0,0,0,0.55);

      --radius: 22px;
      --max: 1400px;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    }
    a{ color:inherit; text-decoration:none; }
    img{ display:block; max-width:100%; }

    /* ===== Background ===== */
    .bg{
      position:fixed; inset:0; z-index:-3;
      background:
        radial-gradient(1200px 700px at 70% 35%, rgba(194,168,117,0.10), transparent 55%),
        radial-gradient(900px 600px at 20% 70%, rgba(194,168,117,0.08), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,0.88), rgba(0,0,0,0.95));
    }
    .bg::before{
      content:"";
      position:absolute; inset:0;
      /* Optional: if you later add a stone background image, put it at assets/bg-stone.webp and uncomment: */
      /* background: url("assets/bg-stone.webp") center/cover no-repeat; */
      opacity:0.45;
      filter: contrast(1.05) saturate(0.9);
      mix-blend-mode: overlay;
    }

    /* ===== Header ===== */
    header{
      position:sticky; top:0; z-index:50;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: linear-gradient(180deg, rgba(0,0,0,0.82), rgba(0,0,0,0.46));
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .navwrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 16px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 12px;
      min-width: 220px;
    }

    /* If you later add a real logo: set src below and remove the brandText block */
    .brandText{
      display:flex;
      flex-direction:column;
      line-height:1.05;
    }
    .brandText .top{
      letter-spacing:0.22em;
      font-size: 12px;
      color: rgba(255,255,255,0.88);
      text-transform: uppercase;
    }
    .brandText .bottom{
      font-weight: 650;
      letter-spacing:0.10em;
      font-size: 12px;
      color: rgba(255,255,255,0.70);
      margin-top:4px;
      text-transform: uppercase;
    }

    nav{
      display:flex;
      align-items:center;
      gap: 26px;
      flex: 1;
      justify-content:center;
      flex-wrap:wrap;
    }
    nav a{
      font-size: 12px;
      letter-spacing: 0.26em;
      color: rgba(255,255,255,0.72);
      transition: color .18s ease;
      text-transform: uppercase;
      padding: 10px 0;
      white-space: nowrap;
    }
    nav a:hover{ color: rgba(255,255,255,0.95); }

    .navCTAs{
      display:flex;
      align-items:center;
      gap: 12px;
      min-width: 280px;
      justify-content:flex-end;
    }
    .pill{
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: 1px solid rgba(194,168,117,0.30);
      background: rgba(0,0,0,0.35);
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
      white-space: nowrap;
    }
    .pill:hover{
      transform: translateY(-1px);
      border-color: rgba(194,168,117,0.45);
      background: rgba(0,0,0,0.45);
    }
    .pill.gold{
      border-color: rgba(194,168,117,0.55);
      background: linear-gradient(180deg, rgba(194,168,117,0.40), rgba(194,168,117,0.18));
      color: rgba(0,0,0,0.92);
      font-weight: 750;
      letter-spacing: 0.12em;
    }
    .pill.gold:hover{
      border-color: rgba(216,191,133,0.72);
      background: linear-gradient(180deg, rgba(216,191,133,0.48), rgba(194,168,117,0.22));
    }

    /* ===== Main / Hero ===== */
    main{
      max-width: var(--max);
      margin: 0 auto;
      padding: 14px 18px 42px; /* tighter like your reference */
    }

    .hero{
      min-height: calc(100vh - 78px);
      display:grid;
      grid-template-columns: 1.25fr 0.95fr; /* makes portrait big like screenshot */
      gap: 26px;
      align-items:center;
    }

    /* LEFT portrait (IMPORTANT FIX) */
    .portraitWrap{
      position:relative;
      min-height: 640px;
      border-radius: 26px;
      overflow:hidden;
      box-shadow: var(--shadow);

      /* Use logo1.png as a background so it crops correctly */
      background:
        linear-gradient(90deg, rgba(0,0,0,0.55), transparent 60%),
        radial-gradient(120% 120% at 55% 35%, transparent 35%, rgba(0,0,0,0.78) 75%),
        url("logo1.png") center/cover no-repeat;

      /* tweak this if you want the face slightly more centered */
      background-position: 35% 30%;
    }

    /* RIGHT tiles */
    .panel{
      display:flex;
      flex-direction:column;
      gap: 18px;
      align-items:flex-end;
      justify-content:center;
      padding-right: 6px;
    }

    .grid{
      width: min(680px, 100%);
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .tile{
      position:relative;
      display:flex;
      align-items:center;
      gap: 16px;
      padding: 18px 18px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--glass), var(--glass2));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow2);
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
      overflow:hidden;
    }
    .tile::before{
      content:"";
      position:absolute; inset:-1px;
      border-radius: inherit;
      background:
        radial-gradient(600px 180px at 20% 0%, rgba(194,168,117,0.12), transparent 60%),
        radial-gradient(600px 180px at 80% 100%, rgba(194,168,117,0.10), transparent 60%);
      opacity: 0.9;
      pointer-events:none;
    }
    .tile:hover{
      transform: translateY(-2px);
      border-color: var(--strokeHover);
      background: linear-gradient(180deg, rgba(0,0,0,0.62), rgba(0,0,0,0.40));
    }

    .tileIcon{
      width: 78px;
      height: 78px;
      flex: 0 0 78px;
      border-radius: 16px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.20);
      border: 1px solid rgba(194,168,117,0.10);
      position:relative;
      z-index:1;
    }
    .tileIcon img{
      width: 78px;
      height: 78px;
      object-fit: cover;
      filter: drop-shadow(0 0 10px rgba(194,168,117,0.18));
    }

    .tileText{
      display:flex;
      flex-direction:column;
      line-height:1.0;
      gap: 6px;
      position:relative;
      z-index:1;
    }
    .tileTitle{
      font-size: 22px;
      font-weight: 650;
      color: rgba(255,255,255,0.92);
      letter-spacing: 0.02em;
    }
    .tileSub{
      font-size: 18px;
      font-weight: 520;
      color: rgba(194,168,117,0.95);
      letter-spacing: 0.02em;
    }

    .tile.call .tileTitle{ font-size: 20px; }
    .tile.call .tileSub{ font-size: 16px; color: rgba(255,255,255,0.80); }

    .micro{
      width:min(680px, 100%);
      margin-top: 8px;
      color: rgba(255,255,255,0.55);
      font-size: 12px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      text-align:right;
    }

    /* ===== Responsive ===== */
    @media (max-width: 980px){
      nav{ display:none; }
      .hero{
        grid-template-columns: 1fr;
        min-height: auto;
      }
      .portraitWrap{ min-height: 440px; }
      .panel{ align-items:stretch; padding-right:0; }
      .grid{ width:100%; }
      .micro{ text-align:left; }
    }

    @media (max-width: 560px){
      .grid{ grid-template-columns: 1fr; }
      .tileTitle{ font-size: 20px; }
      .tileSub{ font-size: 16px; }
      .tileIcon{ width: 70px; height: 70px; flex-basis:70px; }
      .tileIcon img{ width: 70px; height: 70px; }
      .navCTAs .pill{ padding: 9px 12px; font-size: 11px; }
      .portraitWrap{ background-position: 40% 25%; }
    }
  </style>
</head>

<body>

      <nav aria-label="Primary">

      <div class="panel">

            <div class="tileIcon">

          <a class="tile" href="services.html#iaq">

            </div>

          <a class="tile" href="services.html#pool-spa">

        <div class="micro">Licensed • Insured • Photo-Documented Reports</div>

  </main>
</body>
</html>
